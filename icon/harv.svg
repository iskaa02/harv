<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- macOS Style Canvas Gradient -->
    <linearGradient id="bgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD45E"/>
      <stop offset="100%" stop-color="#E5A82E"/>
    </linearGradient>

    <!-- Top Rim Light for App Tile -->
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="8%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Headphone Material Gradient -->
    <linearGradient id="purpleGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3D2956"/>
      <stop offset="100%" stop-color="#241535"/>
    </linearGradient>

    <!-- Tactile macOS Drop Shadow -->
    <filter id="macOSShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#2A1B3D" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#2A1B3D" flood-opacity="0.2"/>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect width="160" height="160" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect width="160" height="160" rx="36" fill="url(#innerGlow)"/>
  <rect x="0.5" y="0.5" width="159" height="159" rx="35.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Main Hero Graphic with macOS Depth -->
  <g filter="url(#macOSShadow)">
    
    <!-- Bunny Ears (Minimal & Sleek) -->
    <!-- Left Ear -->
    <path d="M 52 70 C 40 45, 43 18, 56 14 C 68 10, 75 28, 70 70 Z" 
          fill="url(#purpleGrad)"/>
    <path d="M 54 58 C 47 42, 49 26, 56 22 C 62 18, 67 28, 64 56 Z" 
          fill="#FFA3B1" opacity="0.9"/>

    <!-- Right Ear -->
    <path d="M 90 70 C 85 28, 92 10, 104 14 C 117 18, 120 45, 108 70 Z" 
          fill="url(#purpleGrad)"/>
    <path d="M 96 56 C 93 28, 98 18, 104 22 C 111 26, 113 42, 106 58 Z" 
          fill="#FFA3B1" opacity="0.9"/>

    <!-- Headphone Arch -->
    <path d="M 42 102 C 42 56, 118 56, 118 102" 
          fill="none" 
          stroke="url(#purpleGrad)" 
          stroke-width="12" 
          stroke-linecap="round"/>

    <!-- Minimal Ear Cups -->
    <!-- Left Cup -->
    <rect x="30" y="88" width="22" height="38" rx="11" fill="url(#purpleGrad)"/>
    <rect x="33" y="91" width="6" height="32" rx="3" fill="#FFFFFF" opacity="0.12"/>

    <!-- Right Cup -->
    <rect x="108" y="88" width="22" height="38" rx="11" fill="url(#purpleGrad)"/>
    <rect x="121" y="91" width="6" height="32" rx="3" fill="#FFFFFF" opacity="0.12"/>
    
    <!-- Unified Center Dot / Brand Indicator -->
    <circle cx="80" cy="106" r="4.5" fill="url(#purpleGrad)" opacity="0.9"/>
  </g>
</svg>
