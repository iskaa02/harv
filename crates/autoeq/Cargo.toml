[package]
name = "autoeq"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
player-core = { path = "../player-core" }
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls", "http2", "gzip", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
