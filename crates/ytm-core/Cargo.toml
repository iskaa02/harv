[package]
name = "ytm-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
ytmapi-rs = { version = "0.3", features = ["simplified-queries"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "default-tls", "http2", "gzip"] }
