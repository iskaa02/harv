[package]
name = "player-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
ytm-core = { path = "../ytm-core" }
libmpv2 = { version = "6", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
fastrand = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde_json = "1"
